<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Hardware performance and energy test setup</title><desc id="desc">A target endpoint runs the locked workload while a power monitor and host capture energy, latency, memory, CPU, and thermal state.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0e7490"/></marker><style>text{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:28px;font-weight:700}.b{font-size:18px;font-weight:700}.s{font-size:14px}.device{fill:#e0f2fe;stroke:#0369a1;stroke-width:4}.power{fill:#ffedd5;stroke:#c2410c;stroke-width:3}.host{fill:#dcfce7;stroke:#15803d;stroke-width:3}.line{stroke:#0e7490;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="675" fill="#fff"/><text x="60" y="60" class="h">Figure 9. Device latency, memory, and energy test setup</text>
  <rect x="455" y="120" width="290" height="370" rx="30" class="device"/><rect x="490" y="170" width="220" height="230" rx="10" fill="#fff" stroke="#0369a1" stroke-width="3"/><circle cx="600" cy="445" r="18" fill="#fff" stroke="#0369a1" stroke-width="3"/><text x="600" y="215" class="b" text-anchor="middle">Target endpoint</text><text x="600" y="250" class="s" text-anchor="middle">locked SDK + workload</text><text x="600" y="285" class="s" text-anchor="middle">device / OS / runtime ID</text><text x="600" y="320" class="s" text-anchor="middle">thermal + power mode</text><text x="600" y="355" class="s" text-anchor="middle">latency / memory / CPU</text>
  <rect x="60" y="230" width="260" height="150" rx="16" class="power"/><text x="190" y="275" class="b" text-anchor="middle">Calibrated power monitor</text><text x="190" y="310" class="s" text-anchor="middle">voltage x current over interval</text><text x="190" y="340" class="s" text-anchor="middle">external energy input (mWh)</text>
  <rect x="880" y="230" width="260" height="150" rx="16" class="host"/><text x="1010" y="275" class="b" text-anchor="middle">Evidence workstation</text><text x="1010" y="310" class="s" text-anchor="middle">start/stop synchronization</text><text x="1010" y="340" class="s" text-anchor="middle">raw profiler + JSON report</text>
  <path d="M320 305H452M745 305H877" class="line"/>
  <rect x="300" y="545" width="600" height="75" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><text x="600" y="578" class="b" text-anchor="middle">At least 5 stabilized repetitions per supported device condition</text><text x="600" y="603" class="s" text-anchor="middle">retain median, worst run, profiler exports, and acceptance decision</text>
</svg>
