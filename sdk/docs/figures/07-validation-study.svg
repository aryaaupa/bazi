<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Participant-disjoint validation design</title><desc id="desc">Participants are separated before development, then the locked model is evaluated on held-out silent-mode participants with bootstrap and subgroup analysis.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0e7490"/></marker><style>text{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:28px;font-weight:700}.b{font-size:17px;font-weight:700}.s{font-size:13px}.dev{fill:#e0f2fe;stroke:#0369a1;stroke-width:3}.hold{fill:#dcfce7;stroke:#15803d;stroke-width:3}.lock{fill:#ffedd5;stroke:#c2410c;stroke-width:3}.line{stroke:#0e7490;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="675" fill="#fff"/><text x="60" y="60" class="h">Figure 7. Participant-disjoint held-out validation</text>
  <rect x="55" y="155" width="210" height="110" rx="14" class="dev"/><text x="160" y="195" class="b" text-anchor="middle">Eligible participants</text><text x="160" y="225" class="s" text-anchor="middle">consented + adjudicable</text>
  <rect x="340" y="100" width="210" height="110" rx="14" class="dev"/><text x="445" y="140" class="b" text-anchor="middle">Development IDs</text><text x="445" y="170" class="s" text-anchor="middle">fit + tune + calibrate</text>
  <rect x="340" y="300" width="210" height="110" rx="14" class="hold"/><text x="445" y="340" class="b" text-anchor="middle">Held-out IDs</text><text x="445" y="370" class="s" text-anchor="middle">prospective silent mode</text>
  <rect x="625" y="100" width="210" height="110" rx="14" class="lock"/><text x="730" y="140" class="b" text-anchor="middle">Lock artifact</text><text x="730" y="170" class="s" text-anchor="middle">weights + threshold + plan</text>
  <rect x="625" y="300" width="210" height="110" rx="14" class="hold"/><text x="730" y="340" class="b" text-anchor="middle">Primary metrics</text><text x="730" y="370" class="s" text-anchor="middle">calibration + burden + AUC</text>
  <rect x="910" y="300" width="235" height="110" rx="14" class="hold"/><text x="1028" y="340" class="b" text-anchor="middle">Participant bootstrap</text><text x="1028" y="370" class="s" text-anchor="middle">95% CI + subgroups</text>
  <path d="M265 190L337 155M265 225L337 340M550 155H622M550 355H622M835 355H907M730 210V297" class="line"/>
  <rect x="340" y="510" width="495" height="80" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><text x="588" y="545" class="b" text-anchor="middle">No participant crosses the development / held-out boundary</text><text x="588" y="570" class="s" text-anchor="middle">censored records remain in the study flow accounting</text>
</svg>
